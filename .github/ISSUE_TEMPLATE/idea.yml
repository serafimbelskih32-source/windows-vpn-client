name: Idea or wish / Идея или пожелание
description: What is missing in the program / Чего не хватает в программе
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What to add or change / Что добавить или изменить
      description: Describe what you want and why you need it (English or Russian). / Опиши, что хочется, и зачем это нужно (по-английски или по-русски).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: For which system / Для какой системы
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - All / Для всех
